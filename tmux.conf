# ╔═══════════════════════════════════════════════════════════════════╗
# ║  RED-TMUX — конфиг tmux под пентест / экзамены (CPTS, OSCP, CTF)  ║
# ╚═══════════════════════════════════════════════════════════════════╝
#  Путь:     ~/.tmux.conf (симлинк)
#  Плагины:  TPM → после правки нажать  prefix + I
#  Зависимости:  sudo apt install xsel
#
# ─────────────────────────────────────────────────────────────────────
#  КРАТКИЙ СЛОВАРЬ
# ─────────────────────────────────────────────────────────────────────
#  server    Фоновый процесс, в котором живут все сессии.
#  session   Именованный набор окон (attach / detach).
#  window    Вкладка внутри сессии.
#  pane      Панель (сплит) внутри окна.
#  prefix    Ведущая клавиша, по умолчанию Ctrl+b.
#
#  tmux new -s <имя>             создать сессию
#  tmux ls                       список сессий
#  tmux attach -t <имя>          подключиться
#  tmux kill-session -t <имя>    удалить сессию
#
# ─────────────────────────────────────────────────────────────────────
#  КОПИРОВАНИЕ
# ─────────────────────────────────────────────────────────────────────
#  Выделил мышью → текст сразу в системном буфере (виден в Windows).
#  Через клавиатуру: prefix + [ → v → y.
#  Shift при выделении отдаёт мышь терминалу (копировать Ctrl+Shift+C).
#
# ─────────────────────────────────────────────────────────────────────
#  ГОРЯЧИЕ КЛАВИШИ (Alt, без prefix)
# ─────────────────────────────────────────────────────────────────────
#  Alt+Enter      новое окно + переименование     Alt+q   убить окно
#  Alt+1..9       перейти в окно N                Alt+`   перейти в окно 1
#  Alt+,          переименовать окно              Alt+s   список сессий
#  Alt+h / v      сплит горизонтальный / верт.    Alt+d   detach
#  Alt+стрелки    переход между панелями          Alt+c   убить панель
#  Alt+Shift+стр. изменить размер панели          Alt+Q   убить сессию
#  Alt+z          панель на всё окно (zoom)       Alt+r   перечитать конфиг
#  Alt+/  Alt+?   поиск вниз / вверх              prefix+y  ввод во все панели
#
#  Alt+1..9 может перехватывать терминал. Для qterminal (Kali):
#    sed -i.bak -E 's/^([^=]*)=Alt\+[1-9]$/\1=/' ~/.config/qterminal.org/qterminal.ini
# ─────────────────────────────────────────────────────────────────────


# ═════════════════════════════════════════════════════════════════════
#  1. ТЕРМИНАЛ
# ═════════════════════════════════════════════════════════════════════
set -g  default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"    # true color (tmux >= 3.2)
set -s  escape-time 0                              # без задержки после Esc
set -g  focus-events on


# ═════════════════════════════════════════════════════════════════════
#  2. ОБЩЕЕ
# ═════════════════════════════════════════════════════════════════════
set  -g mouse on
set  -g history-limit 500000                       # скроллбэк = макс. длина лога
set  -g base-index 1                               # окна с 1
setw -g pane-base-index 1                          # панели с 1
set  -g renumber-windows on
set  -g allow-rename off
setw -g automatic-rename off
set  -g display-time 2000


# ═════════════════════════════════════════════════════════════════════
#  3. ВНЕШНИЙ ВИД
# ═════════════════════════════════════════════════════════════════════
set -g pane-border-lines double
set -g set-titles on
set -g set-titles-string "#S:#I #W"


# ═════════════════════════════════════════════════════════════════════
#  4. БУФЕР ОБМЕНА
# ═════════════════════════════════════════════════════════════════════
# xsel вместо xclip: xclip не удерживал буфер, и VMware не успевал его
# забрать (в Windows ничего не вставлялось).
set -s set-clipboard on
set -s copy-command "xsel -ib"


# ═════════════════════════════════════════════════════════════════════
#  5. ГОРЯЧИЕ КЛАВИШИ
# ═════════════════════════════════════════════════════════════════════

# ── Конфиг и сессии ──────────────────────────────────────────────────
bind -n M-r  source-file ~/.tmux.conf \; display "Конфиг перезагружен!"
bind -n M-s  choose-tree -s
bind -n M-d  detach
bind -n M-Q  confirm-before -p "Убить всю сессию? (y/n)" kill-session

# ── Окна ─────────────────────────────────────────────────────────────
bind -n M-Enter new-window -c "#{pane_current_path}" \; command-prompt -I "#W" "rename-window -- '%%'"
bind -n M-,     command-prompt -I "#W" "rename-window '%%'"
bind -n M-q     confirm-before -p "Убить окно? (y/n)" kill-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n 'M-`' select-window -t 1                   # запасной вариант для Alt+1

# ── Панели ───────────────────────────────────────────────────────────
bind -n M-h split-window -v -c "#{pane_current_path}"
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-c confirm-before -p "Убить панель? (y/n)" kill-pane
bind -n M-z resize-pane -Z                         # zoom: панель на всё окно

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 3
bind -n M-S-Down  resize-pane -D 3

bind y setw synchronize-panes                      # prefix+y: ввод во все панели

# ── Режим копирования (vi) ───────────────────────────────────────────
# Бинды y / Enter / мышь — в секции 8 (после плагинов).
setw -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -n M-/ copy-mode \; command-prompt -p "(поиск вниз)"  "send -X search-forward '%%%'"
bind -n M-? copy-mode \; command-prompt -p "(поиск вверх)" "send -X search-backward '%%%'"


# ═════════════════════════════════════════════════════════════════════
#  6. ПЛАГИНЫ
# ═════════════════════════════════════════════════════════════════════
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# ── Тема ─────────────────────────────────────────────────────────────
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'                        # dark | dark256 | light

# ── Сохранение раскладки ─────────────────────────────────────────────
# Текст панелей при restore не впечатываем: он без цвета, и окно
# выглядело «плоским». Раскладка и пути восстанавливаются, шелл живой.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'off'

# Автосейв каждые 15 мин. Авто-restore выключен, чтобы новая сессия не
# тащила за собой старые. Вручную: prefix+Ctrl-s (save), prefix+Ctrl-r (restore).
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'

# ── Логирование (ручное: prefix + P) ─────────────────────────────────
# Чистый лог на каждый prompt ведёт сам zsh (zsh/red-tmux.zsh).
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @logging-path               "$HOME/logs"
set -g @screen-capture-path        "$HOME/logs"
set -g @save-complete-history-path "$HOME/logs"
set -g @logging-filename "#{session_name}-#{window_index}.#{pane_index}-%Y%m%d_%H%M%S.log"
run-shell "mkdir -p $HOME/logs"


# ═════════════════════════════════════════════════════════════════════
#  7. ЗАПУСК TPM  (всегда после списка плагинов и перед секцией 8)
# ═════════════════════════════════════════════════════════════════════
run '~/.tmux/plugins/tpm/tpm'


# ═════════════════════════════════════════════════════════════════════
#  8. КОПИРОВАНИЕ В СИСТЕМНЫЙ БУФЕР  (обязательно ПОСЛЕ TPM)
# ═════════════════════════════════════════════════════════════════════
# Переопределяем после плагинов, чтобы последнее слово осталось за нами.
bind -T copy-mode-vi y                 send -X copy-pipe-and-cancel "xsel -ib"
bind -T copy-mode-vi Enter             send -X copy-pipe-and-cancel "xsel -ib"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xsel -ib"
