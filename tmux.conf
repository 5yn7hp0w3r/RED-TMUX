# RED-TMUX — конфиг tmux под пентест/экзамены (CPTS, OSCP, CTF).
# Чистый лог терминала + автосейв раскладки. Подробности в README.md.
# Путь: ~/.tmux.conf (симлинк). Плагины: TPM, потом prefix + I.
#
#   СЛОВАРЬ tmux
#   ---------------------------------------------------------------
#   tmux = терминальный мультиплексор. В фоне работает СЕРВЕР, а твой
#   терминал — лишь окно-просмотр. Закрыл терминал / отвалился SSH —
#   шеллы продолжают жить на сервере.
#
#     server   (сервер)  Один фоновый процесс, где лежат все сессии.
#     session  (сессия)  Именованный набор окон; к ней attach/detach.
#     window   (окно)     Как вкладка в браузере внутри сессии.
#     pane     (панель)   Сплит внутри окна — по шеллу на каждую.
#     client   (клиент)   Терминал, который сейчас смотрит в сессию.
#
#   Команды:
#     tmux new -s <имя>           создать сессию
#     tmux ls                     список сессий
#     tmux attach -t <имя>        подключиться (кратко: tmux a -t <имя>)
#     tmux kill-session -t <имя>  удалить сессию
#     detach = оставить в фоне (клавиша M-d)
#
#   prefix = ведущая клавиша, по умолчанию Ctrl+b. "prefix + I" =
#            нажать Ctrl+b, отпустить, затем I.
#
#   Копирование: при mouse on выделение мышью уходит в буфер tmux.
#   Чтобы скопировать в буфер хоста/ВМ обычным способом — ЗАЖМИ SHIFT
#   при выделении (мышь вернётся самому терминалу).
#
#   Конфликт Alt+1..9: некоторые терминалы забирают Alt+1..9 под свои
#   вкладки. Чинить в ТЕРМИНАЛЕ. qterminal (Kali), закрыть полностью:
#     sed -i.bak -E 's/^([^=]*)=Alt\+[1-9]$/\1=/' ~/.config/qterminal.org/qterminal.ini
#   Запасной бинд ниже: Alt+` тоже прыгает на окно 1.
#
# =====================================================================


# =====================================================================
# 1. ТЕРМИНАЛ
# =====================================================================
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"   # true color (tmux >= 3.2)
set -s escape-time 0                               # без задержки после Esc
set -g focus-events on


# =====================================================================
# 2. ОБЩЕЕ
# =====================================================================
set -g mouse on
set -g history-limit 500000                        # потолок скроллбэка = макс. длина чистого лога
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename off
setw -g automatic-rename off
set -g display-time 2000


# =====================================================================
# 3. ВНЕШНИЙ ВИД
# =====================================================================
set -g pane-border-lines double
set -g set-titles on
set -g set-titles-string "#S:#I #W"


# =====================================================================
# 4. БУФЕР ОБМЕНА
# =====================================================================
set -s set-clipboard on
if-shell '[ -n "$WAYLAND_DISPLAY" ]' \
  'set -s copy-command "wl-copy"' \
  'set -s copy-command "xclip -selection clipboard -i"'


# =====================================================================
# 5. ГОРЯЧИЕ КЛАВИШИ  (большинство на Alt, без префикса)
# =====================================================================
# --- конфиг и сессии ---
bind -n M-r source-file ~/.tmux.conf \; display "Конфиг перезагружен!"
bind -n M-s choose-tree -s
bind -n M-d detach
bind -n M-Q confirm-before -p "Убить всю сессию? (y/n)" kill-session

# --- окна ---
bind -n M-Enter new-window -c "#{pane_current_path}" \; command-prompt -I "#W" "rename-window -- '%%'"  # новое окно + сразу переименование (Enter = дефолт)
bind -n M-q confirm-before -p "Убить окно? (y/n)" kill-window
bind -n M-, command-prompt -I "#W" "rename-window '%%'"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n 'M-`' select-window -t 1      # Alt+` → окно 1 (обход перехвата Alt+1)

# --- панели ---
bind -n M-h split-window -v -c "#{pane_current_path}"
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-c confirm-before -p "Убить панель? (y/n)" kill-pane
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 3
bind -n M-S-Down  resize-pane -D 3
bind y setw synchronize-panes         # ввод сразу во все панели окна

# --- режим копирования (vi) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -n M-/ copy-mode \; command-prompt -p "(поиск вниз)" "send -X search-forward '%%%'"
bind -n M-? copy-mode \; command-prompt -p "(поиск вверх)" "send -X search-backward '%%%'"


# =====================================================================
# 6. ПЛАГИНЫ
# =====================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'          # тема статус-бара: dark | dark256 | light
set -g @plugin 'tmux-plugins/tmux-resurrect'
# НЕ впечатывать сохранённый текст панелей при restore: он без цвета и
# первое окно выглядело «плоским». Окна/раскладка/пути восстанавливаются,
# но панели = чистый живой цветной шелл.
set -g @resurrect-capture-pane-contents 'off'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
# Авто-restore ВЫКЛ: иначе `tmux new -s X` на холодный сервер вытаскивал
# и старые сохранённые сессии рядом с новой. Сейв каждые 15 мин продолжается,
# раскладку поднимаешь вручную когда нужно: prefix + Ctrl-r (restore),
# prefix + Ctrl-s (save).
set -g @continuum-restore 'off'
# логирование: пишет в ~/logs/, автостарт хуками (ниже)
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @logging-path "$HOME/logs"
set -g @screen-capture-path "$HOME/logs"
set -g @save-complete-history-path "$HOME/logs"
# имя файла: сессия-окно.панель-дата_время.log (как в существующих логах)
set -g @logging-filename "#{session_name}-#{window_index}.#{pane_index}-%Y%m%d_%H%M%S.log"
run-shell "mkdir -p $HOME/logs"

# --- ЛОГИРОВАНИЕ ---
# Чистый лог ведёт САМ zsh: снимает отрисованный экран (capture-pane) на
# каждый prompt в ~/logs/. Настроено в zsh/red-tmux.zsh, здесь ничего не нужно.
# Ручной prefix+P у плагина tmux-logging остаётся.


# =====================================================================
# 7. ИНИЦИАЛИЗАЦИЯ — TPM (держать выше секции 8)
# =====================================================================
run '~/.tmux/plugins/tpm/tpm'

